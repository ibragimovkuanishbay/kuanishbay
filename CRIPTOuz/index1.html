	<script>
  // === 1. НАСТРОЙКА ВРЕМЕНИ ДОСТУПА ===
  const startTime = new Date(2026, 10, 18, 9, 0);   // Дата и время начала теста
  const endTime   = new Date(2026, 10, 19, 14, 50); // Дата и время окончания теста

  const now = new Date();

  if (now < startTime) {
    document.addEventListener("DOMContentLoaded", function() {
      document.body.innerHTML = "<h1 style='color:orange; text-align:center; margin-top:30vh; font-family:sans-serif;'>TEST ele baslanbadi!<br><br>Ol kosetilgen waqittan son baslanadi: " + startTime.toLocaleString() + "</h1>";
    });
  } 
  else if (now > endTime) {
    document.addEventListener("DOMContentLoaded", function() {
      document.body.innerHTML = "<h1 style='color:red; text-align:center; margin-top:30vh; font-family:sans-serif;'> Test tapsırıw waqtı ótti!<br><br> Testke ruxsat jabıq.</h1>";
    });
  } 
  else {
    // === 2. НАСТРОЙКА ЗАЩИТЫ ОТ СПИСЫВАНИЯ ===
    let warningCount = parseInt(localStorage.getItem('test_warnings') || '0');
    const maxWarnings = 3; // Ровно 2 предупреждения, на 3-й уход — блокировка

    // Проверка при загрузке страницы: если лимит уже был исчерпан ранее
    if (warningCount > maxWarnings) {
      document.addEventListener("DOMContentLoaded", function() {
        document.body.innerHTML = "<h1 style='color:red; text-align:center; margin-top:30vh; font-family:sans-serif;'>Qaǵıyda buzıwlar shegarasına jetti! Test biykar etildi.</h1>";
      });
    }

    // Функция фиксации ухода (срабатывает надежно и при сворачивании, и при переключении)
    function handleViolation() {
      // Проверяем, действительно ли страница скрыта или потеряла фокус
      if (document.hidden || document.hasFocus() === false) {
        warningCount++;
        localStorage.setItem('test_warnings', warningCount);
        
        if (warningCount <= maxWarnings) {
          alert("DÍQQAT! Siz test betinen shıqtıńız. Eskertiw №" + warningCount + " dan " + maxWarnings);
        } else {
          document.body.innerHTML = "<h1 style='color:red; text-align:center; margin-top:30vh; font-family:sans-serif;'>Qaǵıyda buzıwlar shegarasına jetti (3 marte)! Test biykar etildi.</h1>";
        }
      }
    }

    // Отслеживаем и скрытие вкладки, и потерю фокуса браузера на телефоне
    document.addEventListener("visibilitychange", function() {
      if (document.hidden) {
        handleViolation();
      }
    });

    window.addEventListener("blur", function() {
      handleViolation();
    });
  }
</script>
